services:
  - type: web
    name: chatbot-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn app:app --timeout 60
    envVars:
      - key: GROQ_MODEL
        value: qwen/qwen3.6-27b
      - key: LLM_PROVIDER
        value: groq
      - key: FRONTEND_URL
        value: "*"
